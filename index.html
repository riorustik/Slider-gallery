<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slider</title>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
    />
    <link rel="stylesheet"
          href="styles.css"/>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div style="background: #00A19B">
            <h1>Mercedes-AMG Petronas <br>F1 Team</h1>
        </div>
        <div style="background: #FF8000">
            <h1>McLaren Mastercard F1 Team</h1>
        </div>
        <div style="background: #00A0DE">
            <h1>Williams Racing</h1>
        </div>
        <div style="background: #0C1E41">
            <h1>Red Bull Racing</h1>
        </div>
        <div style="background: #BD162C">
            <h1>Scuderia Ferrari</h1>
        </div>
    </div>
    <div class="main-slide">
        <div
                style="
            background-image: url('./source/image/f.jpg');
          "
        ></div>
        <div
                style="
            background-image: url('./source/image/rb.jpg');
          "
        ></div>
        <div
                style="
            background-image: url('./source/image/w.jpg');
          "
        ></div>
        <div
                style="
            background-image: url('source/image/mc.jpg');
          "
        ></div>
        <div
                style="
            background-image: url('./source/image/m.jpg');
          "
        ></div>
    </div>
    <div class="controls">
        <button class="down-button">
            <i class="fas fa-arrow-down"></i>
        </button>
        <button class="up-button">
            <i class="fas fa-arrow-up"></i>
        </button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
