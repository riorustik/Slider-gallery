<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slider</title>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
    />
    <link rel="stylesheet"
          href="styles.css"/>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div style="background: linear-gradient(229.99deg, #24726e -26%, #017E8B 145%);">
            <h1>22</h1>
            <p>222</p>
        </div>
        <div style="background: linear-gradient(229.99deg, #000000 -26%, #000000 145%);">
            <h1>11</h1>
            <p>111</p>
        </div>
        <div style="background: linear-gradient(229.99deg, #11DEE9 -26%, #017E8B 145%);">
            <h1>Snow in the desert</h1>
            <p>Love, death & robots</p>
        </div>
        <div style="background: linear-gradient(215.32deg, #F90306 -1%, #9E0706 124%);">
            <h1>Life Hutch</h1>
            <p>Love, death & robots</p>
        </div>
        <div style="background: linear-gradient(221.87deg, #8308EA 1%, #5305AF 128%);">
            <h1>Zima Blue</h1>
            <p>Love, death & robots</p>
        </div>
    </div>
    <div class="main-slide">
        <div
                style="
            background-image: url('./source/image/f.jpg');
          "
        ></div>
        <div
                style="
            background-image: url('./source/image/am.jpg');
          "
        ></div>
        <div
                style="
            background-image: url('./source/image/m.jpg');
          "
        ></div>
        <div
                style="
            background-image: url('./source/image/rb.jpg');
          "
        ></div>
        <div
                style="
            background-image: url('./source/image/w.jpg');
          "
        ></div>
    </div>
    <div class="controls">
        <button class="down-button">
            <i class="fas fa-arrow-down"></i>
        </button>
        <button class="up-button">
            <i class="fas fa-arrow-up"></i>
        </button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
